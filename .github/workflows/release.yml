name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Build frontend
        run: npm --prefix frontend ci && npm --prefix frontend run build
      - name: Build Rust release binary
        run: cargo build --release --locked -p glorious-service
      - name: Build Linux packages
        run: |
          scripts/build-linux-packages.sh --skip-frontend --skip-cargo
          cp target/release/glorious-service target/packages/glorious-service-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: target/packages/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: ./scripts/build-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: target/installer/*.exe

  release:
    needs:
      - linux
      - windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: target/packages
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: target/installer
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/packages/*
            target/installer/*.exe
